name: Build Kernel OOS12 - OnePlus 7 Series

on:
  push:
    branches: [ "thirteen", "main", "master" ]
  pull_request:
    branches: [ "thirteen", "main", "master" ]
  workflow_dispatch:
    inputs:
      device:
        description: "Target device label for artifact name"
        required: true
        default: "OnePlus7T"
        type: choice
        options:
          - OnePlus7T
          - OnePlus7Pro
          - OnePlus7

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      DEVICE: ${{ github.event.inputs.device || 'OnePlus7T' }}
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig
      CLANG_DIR: prebuilts-master/clang/host/linux-x86/clang-r383902
      GCC64_DIR: prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init build log
        run: |
          : > build.log
          {
            echo "Build started: $(date -u)"
            echo "Runner: $(uname -a)"
            echo "Workspace: $PWD"
          } | tee -a build.log

      - name: Free disk space
        run: |
          set -euo pipefail
          {
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/share/boost
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
            df -h
          } 2>&1 | tee -a build.log

      - name: Install dependencies
        run: |
          set -euo pipefail
          {
            sudo apt-get update -qq
            sudo apt-get install -y \
              bc bison build-essential ccache flex \
              libelf-dev libncurses-dev libssl-dev \
              python3 rsync zip wget curl git \
              device-tree-compiler \
              gcc-arm-linux-gnueabi
            /usr/bin/dtc --version
          } 2>&1 | tee -a build.log

      - name: Cache prebuilts
        uses: actions/cache@v4
        with:
          path: |
            prebuilts-master/clang/host/linux-x86/clang-r383902
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          key: prebuilts-clang-r383902-gcc64-v3
          restore-keys: |
            prebuilts-clang-r383902-gcc64-

      - name: Fetch Clang r383902
        run: |
          set -euo pipefail
          {
            mkdir -p "${CLANG_DIR}"
            if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
              TMP_TGZ="/tmp/clang-r383902.tar.gz"
              URLS=(
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz"
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902.tar.gz"
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r28/clang-r383902.tar.gz"
              )

              ok=0
              for url in "${URLS[@]}"; do
                echo "Trying: $url"
                if wget -q -O "$TMP_TGZ" "$url" && file "$TMP_TGZ" | grep -q "gzip compressed"; then
                  tar -xzf "$TMP_TGZ" -C "${CLANG_DIR}"
                  ok=1
                  break
                fi
              done
              [ "$ok" = "1" ] || { echo "Failed to download clang-r383902"; exit 1; }
            fi

            test -x "${CLANG_DIR}/bin/clang"
            "${CLANG_DIR}/bin/clang" --version
          } 2>&1 | tee -a build.log

      - name: Fetch AArch64 prebuilts
        run: |
          set -euo pipefail
          {
            GCC64_COMMIT="043dc0ad16a73e0e1973132d00fa6265ab4fa6ba"
            mkdir -p "$(dirname "${GCC64_DIR}")"
            rm -rf "${GCC64_DIR}"
            mkdir -p "${GCC64_DIR}"

            git -C "${GCC64_DIR}" init
            git -C "${GCC64_DIR}" remote add origin https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
            git -C "${GCC64_DIR}" fetch --depth=1 origin "${GCC64_COMMIT}"
            git -C "${GCC64_DIR}" checkout -q FETCH_HEAD

            test -d "${GCC64_DIR}/bin"
            test -x "${GCC64_DIR}/bin/aarch64-linux-android-nm"
            test -x "${GCC64_DIR}/bin/aarch64-linux-android-objcopy"

            for f in "${GCC64_DIR}/bin/aarch64-linux-android-"*; do
              b="$(basename "$f")"
              s="${b#aarch64-linux-android-}"
              ln -sf "$b" "${GCC64_DIR}/bin/aarch64-linux-androidkernel-${s}"
            done

            test -x "${GCC64_DIR}/bin/aarch64-linux-androidkernel-nm"
          } 2>&1 | tee -a build.log

      - name: Export toolchain paths
        run: |
          set -euo pipefail
          {
            CLANG_BIN="$(pwd)/${CLANG_DIR}/bin"
            GCC64_BIN="$(pwd)/${GCC64_DIR}/bin"

            echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
            echo "GCC64_BIN=${GCC64_BIN}" >> "$GITHUB_ENV"

            echo "${CLANG_BIN}" >> "$GITHUB_PATH"
            echo "${GCC64_BIN}" >> "$GITHUB_PATH"
          } 2>&1 | tee -a build.log

      - name: Apply source patches
        run: |
          set -euo pipefail
          {
            DEFS_OP="include/uapi/media/cam_defs_op.h"
            if [ -f "$DEFS_OP" ]; then
              if ! grep -q "struct cam_dump_req_cmd" "$DEFS_OP"; then
                cat > /tmp/cam_defs_insert.h <<'EOF'
#define CAM_DUMP_REQ (CAM_COMMON_OPCODE_BASE_v2 + 0x5)

struct cam_dump_req_cmd {
    int64_t  issue_req_id;
    int32_t  session_handle;
    int32_t  link_hdl;
    int32_t  dev_handle;
    int32_t  error_type;
    uint32_t buf_handle;
    int32_t  offset;
    uint32_t reserved;
};
EOF
                # awk вставляет блок ПЕРЕД первой строкой с #endif ...__UAPI_CAM_DEFS_H__,
                # сам #endif не изменяется. Это 1:1 поведение оригинального 'sed i'.
                awk '
                  BEGIN {
                    while ((getline l < "/tmp/cam_defs_insert.h") > 0) ins = ins l "\n"
                  }
                  !done && /#endif.*__UAPI_CAM_DEFS_H__/ { printf "%s", ins; done = 1 }
                  { print }
                ' "$DEFS_OP" > /tmp/cam_defs_op.new
                mv /tmp/cam_defs_op.new "$DEFS_OP"
                echo "Patched: Added struct cam_dump_req_cmd to cam_defs_op.h"
              fi
            fi

            CAM_CTX_H="drivers/media/platform/msm/camera/cam_core/cam_context.h"
            if [ -f "$CAM_CTX_H" ]; then
              if ! grep -q "cam_defs.h" "$CAM_CTX_H"; then
                sed -i '/#include "cam_req_mgr_interface.h"/i #include <uapi/media/cam_defs.h>' "$CAM_CTX_H"
                echo "Patched: Added cam_defs.h include to cam_context.h"
              fi
            fi

            DC_DIMING="drivers/gpu/drm/msm/oplus/oplus_dc_diming.c"
            if [ -f "$DC_DIMING" ]; then
              sed -i 's/^extern oplus_dc_v2_on;/extern int oplus_dc_v2_on;/' "$DC_DIMING"
              echo "Patched: Fixed extern type in oplus_dc_diming.c"
            fi

            find drivers/soc/oplus -name "*.c" -exec sed -i 's|asm/uaccess.h|linux/uaccess.h|g' {} + 2>/dev/null || true
            echo "Patched: Fixed uaccess.h includes"
          } 2>&1 | tee -a build.log

      - name: Configure kernel
        run: |
          set -euxo pipefail
          {
            export PATH="${CLANG_BIN}:${GCC64_BIN}:$PATH"

            mkdir -p out
            make O=out \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="${CLANG_BIN}/clang" \
              LD="${CLANG_BIN}/ld.lld" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-androidkernel- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              "${KERNEL_DEFCONFIG}"

            make O=out \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="${CLANG_BIN}/clang" \
              LD="${CLANG_BIN}/ld.lld" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-androidkernel- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              olddefconfig
          } 2>&1 | tee -a build.log

      - name: Build kernel
        run: |
          set -euxo pipefail
          {
            export PATH="${CLANG_BIN}:${GCC64_BIN}:$PATH"

            NUM_JOBS=$(( $(nproc) / 2 ))
            echo "Building with ${NUM_JOBS} parallel jobs"

            test -x "${CLANG_BIN}/clang"
            test -x "${CLANG_BIN}/ld.lld"
            test -x "${CLANG_BIN}/llvm-objdump"

            make -j"${NUM_JOBS}" \
              O=out \
              ARCH="${ARCH}" \
              SUBARCH="${SUBARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              CC="${CLANG_BIN}/clang" \
              LD="${CLANG_BIN}/ld.lld" \
              AR="${CLANG_BIN}/llvm-ar" \
              NM="${CLANG_BIN}/llvm-nm" \
              OBJCOPY="${CLANG_BIN}/llvm-objcopy" \
              OBJDUMP="${CLANG_BIN}/llvm-objdump" \
              STRIP="${CLANG_BIN}/llvm-strip" \
              READELF="${CLANG_BIN}/llvm-readelf" \
              HOSTAR="${CLANG_BIN}/llvm-ar" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-androidkernel- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              DTC=/usr/bin/dtc \
              DTC_EXT=/usr/bin/dtc \
              DTC_FLAGS="-Wno-avoid_default_addr_size -Wno-interrupt_provider" \
              Image.gz dtbs modules

            ls -la out/arch/arm64/boot/ || true
          } 2>&1 | tee -a build.log

      - name: Validate output
        if: success()
        run: |
          set -euo pipefail
          {
            if [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image ] || [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "Kernel image found"
            else
              echo "Kernel image not found"
              exit 1
            fi
          } 2>&1 | tee -a build.log

      - name: Prepare AnyKernel3
        if: success()
        run: |
          set -euo pipefail
          {
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh

            if [ -f out/arch/arm64/boot/Image.gz ]; then
              cp out/arch/arm64/boot/Image.gz anykernel/
            elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              cp out/arch/arm64/boot/Image.gz-dtb anykernel/
            else
              cp out/arch/arm64/boot/Image anykernel/
            fi

            if find out/arch/arm64/boot/dts -type f -name "*.dtb" 2>/dev/null | grep -q .; then
              find out/arch/arm64/boot/dts -type f -name "*.dtb" | sort | xargs cat > anykernel/dtb
            elif [ -f out/arch/arm64/boot/dtb ]; then
              cp out/arch/arm64/boot/dtb anykernel/dtb
            fi
          } 2>&1 | tee -a build.log

      - name: Create flashable ZIP
        if: success()
        run: |
          set -euo pipefail
          {
            cd anykernel
            ZIP_NAME="Kernel-OOS12-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
            zip -r9 "../${ZIP_NAME}" . -x "*.git*"
            echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          } 2>&1 | tee -a build.log

      - name: Upload kernel zip artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OOS12-${{ env.DEVICE }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-build-output-${{ env.DEVICE }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtb
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7

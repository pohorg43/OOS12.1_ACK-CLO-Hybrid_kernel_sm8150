name: Build Kernel OOS12 - OnePlus 7 Series

on:
  push:
    branches: [ "thirteen", "main", "master" ]
  pull_request:
    branches: [ "thirteen", "main", "master" ]
  workflow_dispatch:
    inputs:
      device:
        description: "Target device label for artifact name"
        required: true
        default: "OnePlus7T"
        type: choice
        options:
          - OnePlus7T
          - OnePlus7Pro
          - OnePlus7

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      DEVICE: ${{ github.event.inputs.device || 'OnePlus7T' }}
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig
      CLANG_PREBUILT_DIR: prebuilts-master/clang/host/linux-x86/clang-r383902/bin
      GCC64_DIR: prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin
      GCC32_DIR: prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache flex \
            libelf-dev libncurses-dev libssl-dev \
            python3 rsync zip wget curl git \
            device-tree-compiler

      - name: Fetch Android prebuilts (clang + gcc)
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86
          mkdir -p prebuilts/gcc/linux-x86/aarch64
          mkdir -p prebuilts/gcc/linux-x86/arm

          # Clang r383902 (matches build.config.common expectation)
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            prebuilts-master/clang/host/linux-x86

          # AArch64 GCC 4.9 prebuilt (matches build.config.aarch64 expectation)
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

          # ARM32 GCC 4.9 prebuilt for CROSS_COMPILE_ARM32
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

          test -x "${CLANG_PREBUILT_DIR}/clang" || (echo "clang-r383902 not found"; exit 1)
          test -x "${GCC64_DIR}/aarch64-linux-android-gcc" || (echo "aarch64 gcc not found"; exit 1)
          test -x "${GCC32_DIR}/arm-linux-androideabi-gcc" || (echo "arm32 gcc not found"; exit 1)

      - name: Export toolchain env
        run: |
          echo "PATH=$(pwd)/${CLANG_PREBUILT_DIR}:$(pwd)/${GCC64_DIR}:$(pwd)/${GCC32_DIR}:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          mkdir -p out
          make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG}
          make O=out ARCH=${ARCH} olddefconfig

      - name: Build kernel
        run: |
          set -o pipefail
          make -j"$(nproc)" \
            O=out \
            ARCH=${ARCH} \
            SUBARCH=${SUBARCH} \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=${CC} \
            LD=${LD} \
            AR=${AR} \
            NM=${NM} \
            OBJCOPY=${OBJCOPY} \
            OBJDUMP=${OBJDUMP} \
            STRIP=${STRIP} \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            DTC=/usr/bin/dtc \
            DTC_EXT=/usr/bin/dtc \
            DTC_CPP_FLAGS="-P" \
            Image.gz dtbs modules 2>&1 | tee build.log

          echo "=== Build output check ==="
          ls -la out/arch/arm64/boot/ || true

          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ] && [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel image not found, build failed."
            exit 1
          fi

      - name: Prepare AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          else
            cp out/arch/arm64/boot/Image anykernel/
          fi

          # Pack all dtb files into a single dtb blob if available
          if find out/arch/arm64/boot/dts -type f -name "*.dtb" | grep -q .; then
            find out/arch/arm64/boot/dts -type f -name "*.dtb" | sort | xargs cat > anykernel/dtb
          elif [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb anykernel/dtb
          fi

      - name: Create flashable ZIP
        run: |
          cd anykernel
          ZIP_NAME="Kernel-OOS12-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload kernel zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OOS12-${{ env.DEVICE }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: Upload build artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-build-output-${{ env.DEVICE }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtb
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          retention-days: 3

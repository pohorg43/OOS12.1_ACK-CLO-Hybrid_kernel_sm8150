name: Build Kernel OOS12 - OnePlus 7 Series

on:
  push:
    branches: [ "thirteen", "main", "master" ]
  pull_request:
    branches: [ "thirteen", "main", "master" ]
  workflow_dispatch:
    inputs:
      device:
        description: "Target device label for artifact name"
        required: true
        default: "OnePlus7Pro"
        type: choice
        options:
          - OnePlus7T
          - OnePlus7Pro
          - OnePlus7

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      DEVICE: ${{ github.event.inputs.device || 'OnePlus7T' }}
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig
      CLANG_DIR: prebuilts-master/clang/host/linux-x86/clang-r383902
      GCC64_DIR: prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init build log
        run: |
          : > build.log
          {
            echo "Build started: $(date -u)"
            echo "Runner: $(uname -a)"
            echo "Workspace: $PWD"
            df -h
          } | tee -a build.log

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h | tee -a build.log

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache flex \
            libelf-dev libncurses-dev libssl-dev python3 rsync zip wget curl git \
            device-tree-compiler gcc-arm-linux-gnueabi
          /usr/bin/dtc --version | tee -a build.log

      - name: Cache prebuilts
        uses: actions/cache@v4
        with:
          path: |
            prebuilts-master/clang/host/linux-x86/clang-r383902
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          key: prebuilts-clang-r383902-gcc64-v3
          restore-keys: |
            prebuilts-clang-r383902-gcc64-

      - name: Fetch Clang r383902
        run: |
          set -euo pipefail
          mkdir -p "${CLANG_DIR}"
          if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
            TMP_TGZ="/tmp/clang-r383902.tar.gz"
            URLS=(
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz"
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902.tar.gz"
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r28/clang-r383902.tar.gz"
            )
            ok=0
            for url in "${URLS[@]}"; do
              echo "Trying: $url"
              if wget -q --timeout=60 -O "$TMP_TGZ" "$url" && file "$TMP_TGZ" | grep -q "gzip compressed"; then
                tar -xzf "$TMP_TGZ" -C "${CLANG_DIR}"
                ok=1
                break
              fi
            done
            [ "$ok" = "1" ] || { echo "ERROR: Failed to download clang-r383902"; exit 1; }
          fi
          "${CLANG_DIR}/bin/clang" --version | tee -a build.log

      - name: Fetch AArch64 prebuilts
        run: |
          set -euo pipefail
          if [ ! -x "${GCC64_DIR}/bin/aarch64-linux-android-gcc" ]; then
            echo "GCC64 not cached, cloning..."
            GCC64_COMMIT="043dc0ad16a73e0e1973132d00fa6265ab4fa6ba"
            mkdir -p "${GCC64_DIR}"
            git -C "${GCC64_DIR}" init
            git -C "${GCC64_DIR}" remote add origin \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
            git -C "${GCC64_DIR}" fetch --depth=1 origin "${GCC64_COMMIT}"
            git -C "${GCC64_DIR}" checkout -q FETCH_HEAD
            for f in "${GCC64_DIR}/bin/aarch64-linux-android-"*; do
              b="$(basename "$f")"
              s="${b#aarch64-linux-android-}"
              ln -sf "$b" "${GCC64_DIR}/bin/aarch64-linux-androidkernel-${s}"
            done
          else
            echo "GCC64 found in cache, skipping clone"
          fi
          echo "GCC OK" | tee -a build.log

      - name: Export toolchain paths
        run: |
          set -euo pipefail
          CLANG_BIN="$(pwd)/${CLANG_DIR}/bin"
          GCC64_BIN="$(pwd)/${GCC64_DIR}/bin"
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
          echo "GCC64_BIN=${GCC64_BIN}" >> "$GITHUB_ENV"
          echo "${CLANG_BIN}" >> "$GITHUB_PATH"
          echo "${GCC64_BIN}" >> "$GITHUB_PATH"

      - name: Apply source patches
        run: |
          set -euo pipefail
          echo "=== Patching uaccess.h includes ===" | tee -a build.log
          find drivers/soc/oplus -name "*.c" -exec sed -i 's|asm/uaccess.h|linux/uaccess.h|g' {} + 2>/dev/null || true
          echo "Patches applied" | tee -a build.log

      - name: Configure kernel
        run: |
          set -euxo pipefail
          export PATH="${CLANG_BIN}:${GCC64_BIN}:$PATH"
          mkdir -p out
          make O=out ARCH="${ARCH}" LLVM=1 LLVM_IAS=1 \
            CC="${CLANG_BIN}/clang" LD="${CLANG_BIN}/ld.lld" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${KERNEL_DEFCONFIG}" 2>&1 | tee -a build.log
          make O=out ARCH="${ARCH}" LLVM=1 LLVM_IAS=1 \
            CC="${CLANG_BIN}/clang" LD="${CLANG_BIN}/ld.lld" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig 2>&1 | tee -a build.log

      - name: Build kernel
        run: |
          set -euo pipefail
          export PATH="${CLANG_BIN}:${GCC64_BIN}:$PATH"
          NUM_JOBS=$(nproc)
          echo "Building with ${NUM_JOBS} jobs" | tee -a build.log
          make -k -j"${NUM_JOBS}" O=out ARCH="${ARCH}" SUBARCH="${SUBARCH}" \
            LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ \
            CC="${CLANG_BIN}/clang" LD="${CLANG_BIN}/ld.lld" \
            AR="${CLANG_BIN}/llvm-ar" NM="${CLANG_BIN}/llvm-nm" \
            OBJCOPY="${CLANG_BIN}/llvm-objcopy" OBJDUMP="${CLANG_BIN}/llvm-objdump" \
            STRIP="${CLANG_BIN}/llvm-strip" READELF="${CLANG_BIN}/llvm-readelf" \
            HOSTAR="${CLANG_BIN}/llvm-ar" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-ferror-limit=0" \
            DTC=/usr/bin/dtc DTC_EXT=/usr/bin/dtc \
            DTC_FLAGS="-Wno-avoid_default_addr_size -Wno-interrupt_provider" \
            Image.gz dtbs modules 2>&1 | tee -a build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -n "error:" build.log | head -200 || echo "No 'error:' lines found"
          echo "=== LAST 100 LINES ==="
          tail -300 build.log

      - name: Validate output
        if: success()
        run: |
          set -euo pipefail
          if [ -f out/arch/arm64/boot/Image.gz ] || \
             [ -f out/arch/arm64/boot/Image ] || \
             [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel image found" | tee -a build.log
          else
            echo "ERROR: Kernel image not found" | tee -a build.log
            exit 1
          fi

      - name: Prepare AnyKernel3
        if: success()
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          else
            cp out/arch/arm64/boot/Image anykernel/
          fi
          if find out/arch/arm64/boot/dts -type f -name "*.dtb" 2>/dev/null | grep -q .; then
            find out/arch/arm64/boot/dts -type f -name "*.dtb" | sort | xargs cat > anykernel/dtb
          elif [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb anykernel/dtb
          fi
          cd anykernel
          ZIP_NAME="Kernel-OOS12-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OOS12-${{ env.DEVICE }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7

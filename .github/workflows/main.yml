name: Build Kernel OOS12 - OnePlus 7 Series

on:
  push:
    branches: [ "thirteen", "main", "master" ]
  pull_request:
    branches: [ "thirteen", "main", "master" ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'OnePlus7T'
        type: choice
        options:
          - OnePlus7T
          - OnePlus7Pro
          - OnePlus7

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEVICE: ${{ github.event.inputs.device || 'OnePlus7T' }}
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig
      CLANG_VERSION: "14"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc build-essential flex bison \
            libssl-dev libelf-dev libncurses-dev \
            clang-${{ env.CLANG_VERSION }} \
            lld-${{ env.CLANG_VERSION }} \
            llvm-${{ env.CLANG_VERSION }} \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

          # Создаём симлинки для LLVM/Clang
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_VERSION }}     /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-${{ env.CLANG_VERSION }}    /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-${{ env.CLANG_VERSION }}   /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-${{ env.CLANG_VERSION }}   /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-${{ env.CLANG_VERSION }} /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-${{ env.CLANG_VERSION }} /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-${{ env.CLANG_VERSION }} /usr/local/bin/llvm-strip
          
- name: Apply source patches
        run: |
          # 1. Фикс oplus_dc_diming.c
          if [ -f drivers/gpu/drm/msm/oplus/oplus_dc_diming.c ]; then
            sed -i 's/extern oplus_dc_v2_on;/extern int oplus_dc_v2_on;/g' drivers/gpu/drm/msm/oplus/oplus_dc_diming.c
          fi

          # 2. Фикс uaccess.h
          find drivers/soc/oplus -name "*.c" -exec sed -i 's/asm\/uaccess.h/linux\/uaccess.h/g' {} + 2>/dev/null || true

          # 3. БЕЗОПАСНОЕ удаление флагов -Werror. 
          find . -type f \( -name "Makefile" -o -name "*.mk" -o -name "Kbuild" \) -exec sed -i 's/-Werror[a-zA-Z0-9_=-]*//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" -o -name "Kbuild" \) -exec sed -i 's/-Wfatal-errors[a-zA-Z0-9_=-]*//g' {} +

          # 4. Фикс драйвера камеры (conflicting types & incomplete definition)
          if [ -f drivers/media/platform/msm/camera/cam_core/cam_context.h ]; then
            sed -i '1i struct cam_dump_req_cmd;' drivers/media/platform/msm/camera/cam_core/cam_context.h
            sed -i '1i #include <media/cam_req_mgr.h>' drivers/media/platform/msm/camera/cam_core/cam_context_utils.c
            echo "Applied cam_dump_req_cmd fix"
          fi
          
      - name: Configure kernel
        run: |
          mkdir -p out
          make O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_DEFCONFIG }}

          # Отключаем LTO и Stack Protector (часто ломают сборку старых ядер новым Clang)
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' out/.config
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config

          make O=out ARCH=${{ env.ARCH }} olddefconfig

      - name: Build kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=${{ env.ARCH }} \
            SUBARCH=${{ env.SUBARCH }} \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=clang \
            CPP="aarch64-linux-gnu-gcc -E" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-unused-function" \
            2>&1 | tee build.log

          # Проверяем что Image собрался
          echo "=== Build output check ==="
          ls -la out/arch/arm64/boot/ || echo "No boot directory found!"

      - name: Prepare AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh

          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          else
            echo "Kernel Image not found! Build likely failed."
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb anykernel/dtb
          fi

      - name: Create flashable ZIP
        run: |
          cd anykernel
          ZIP_NAME="Kernel-OOS12-${{ env.DEVICE }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload kernel zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OOS12-${{ env.DEVICE }}
          path: "*.zip"
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          retention-days: 3

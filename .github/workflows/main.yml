name: Build Kernel OOS12 - OnePlus 7 Series

on:
  push:
    branches: [ "thirteen" ]
  pull_request:
    branches: [ "thirteen" ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'OnePlus7T'
        type: choice
        options:
          - OnePlus7T
          - OnePlus7Pro
          - OnePlus7

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # Меняй под своё устройство:
      # OnePlus 7T  -> hotdog  -> vendor/sm8150-perf_defconfig
      # OnePlus 7 Pro -> guacamole -> vendor/sm8150-perf_defconfig
      DEVICE: ${{ github.event.inputs.device || 'OnePlus7T' }}
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig
      CLANG_VERSION: "14"
      # При cross-compile host-тулзы должны быть нативными
      HOSTCC: gcc
      HOSTCXX: g++

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: thirteen

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc build-essential flex bison \
            libssl-dev libelf-dev libncurses-dev \
            clang-${{ env.CLANG_VERSION }} \
            lld-${{ env.CLANG_VERSION }} \
            llvm-${{ env.CLANG_VERSION }} \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

          # Создаём симлинки без суффикса версии
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_VERSION }}     /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-${{ env.CLANG_VERSION }}    /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-${{ env.CLANG_VERSION }}   /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-${{ env.CLANG_VERSION }}   /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-${{ env.CLANG_VERSION }} /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-${{ env.CLANG_VERSION }} /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-${{ env.CLANG_VERSION }} /usr/local/bin/llvm-strip

          echo "Clang version:"
          clang --version

      - name: Apply source patches
        run: |
          # Фикс: объявление типа для переменной oplus_dc_v2_on
          if [ -f drivers/gpu/drm/msm/oplus/oplus_dc_diming.c ]; then
            sed -i 's/extern oplus_dc_v2_on;/extern int oplus_dc_v2_on;/g' \
              drivers/gpu/drm/msm/oplus/oplus_dc_diming.c
            echo "Applied oplus_dc_v2_on fix"
          fi

          # Фикс: правильный заголовок uaccess
          find drivers/soc/oplus -name "*.c" -exec \
            sed -i 's/asm\/uaccess.h/linux\/uaccess.h/g' {} + 2>/dev/null || true

          # Убираем -Werror и -Wfatal-errors чтобы ошибки компилятора не ломали сборку
          # (исправленный find с правильными скобками)
          find . \( -name "Makefile" -o -name "*.mk" \) \
            -not -path "./.git/*" \
            -not -path "./out/*" | \
            xargs sed -i \
              -e 's/ -Werror//g' \
              -e 's/-Werror //g' \
              -e 's/-Wfatal-errors//g' \
              -e 's/-Wimplicit-function-declaration//g' 2>/dev/null || true

          echo "Patches applied"

      - name: Configure kernel
        run: |
          mkdir -p out

          make \
            O=out \
            ARCH=${{ env.ARCH }} \
            SUBARCH=${{ env.SUBARCH }} \
            HOSTCC=${{ env.HOSTCC }} \
            HOSTCXX=${{ env.HOSTCXX }} \
            ${{ env.KERNEL_DEFCONFIG }}

          # Отключаем stack protector (несовместим с некоторыми версиями clang)
          sed -i \
            's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' \
            out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config

          make \
            O=out \
            ARCH=${{ env.ARCH }} \
            HOSTCC=${{ env.HOSTCC }} \
            HOSTCXX=${{ env.HOSTCXX }} \
            olddefconfig

          echo "=== Config summary ==="
          grep -E "CONFIG_(CC_STACKPROTECTOR|LTO|LOCALVERSION)" out/.config || true

      - name: Build kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=${{ env.ARCH }} \
            SUBARCH=${{ env.SUBARCH }} \
            HOSTCC=${{ env.HOSTCC }} \
            HOSTCXX=${{ env.HOSTCXX }} \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            WERROR=0 \
            KCFLAGS="-w" \
            2>&1 | tee build.log

          # Проверяем что Image собрался
          echo "=== Build output check ==="
          ls -la out/arch/arm64/boot/ || echo "No boot directory found!"

      - name: Prepare AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          # Отключаем проверку устройства (для тестирования)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh

          # Копируем kernel image (проверяем разные варианты имён)
          KERNEL_IMAGE=""
          for img in Image.gz-dtb Image.gz Image; do
            if [ -f "out/arch/arm64/boot/$img" ]; then
              KERNEL_IMAGE="out/arch/arm64/boot/$img"
              echo "Found kernel image: $img"
              break
            fi
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "ERROR: No kernel image found in out/arch/arm64/boot/"
            ls out/arch/arm64/boot/ || true
            exit 1
          fi

          cp "$KERNEL_IMAGE" anykernel/

          # Копируем dtb если есть
          if [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb anykernel/dtb
          fi

      - name: Create flashable ZIP
        run: |
          cd anykernel
          ZIP_NAME="Kernel-OOS12-${{ env.DEVICE }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Created: ${ZIP_NAME}"

      - name: Upload kernel zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OOS12-${{ env.DEVICE }}
          path: "*.zip"
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          retention-days: 3
      

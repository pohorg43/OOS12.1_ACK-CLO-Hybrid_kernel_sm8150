name: Build Kernel (OOS12.1 - sm8150)

on:
  push:
    branches: [ "thirteen" ]
  pull_request:
    branches: [ "thirteen" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  CLANG_DIR: prebuilts-master/clang/host/linux-x86/clang-r383902
  GCC64_DIR: prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "5G"
  CCACHE_COMPRESS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev zip kmod cpio \
            device-tree-compiler python3 lld

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            prebuilts-master/clang
            prebuilts/gcc
          key: tc-clang-r383902-gcc49-${{ runner.os }}-v1
          restore-keys: tc-clang-r383902-gcc49-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Prepare ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: Build
        run: |
          set -euo pipefail

          export CLANG_BIN="${GITHUB_WORKSPACE}/${CLANG_DIR}/bin"
          export GCC64_BIN="${GITHUB_WORKSPACE}/${GCC64_DIR}/bin"
          export PATH="${CLANG_BIN}:${GCC64_BIN}:${PATH}"

          CORES=$(nproc)
          MEM_MB=$(free -m | awk '/^Mem:/{print $2}')
          JOBS=$(( MEM_MB / 1500 ))
          [ "$JOBS" -lt 1 ] && JOBS=1
          [ "$JOBS" -gt 4 ] && JOBS=4
          echo "Using -j${JOBS} (${MEM_MB}MB RAM, ${CORES} cores)"

          # Auto-find defconfig
          DEFCONFIG=""
          for f in \
            vendor/sm8150-perf_defconfig \
            vendor/sm8150_defconfig \
            msmnile_defconfig \
            msmnile-perf_defconfig; do
            if [ -f "arch/arm64/configs/${f}" ]; then
              DEFCONFIG="$f"
              break
            fi
          done
          [ -z "$DEFCONFIG" ] && { echo "ERROR: no defconfig found"; exit 1; }
          echo "Defconfig: ${DEFCONFIG}"

          M="ARCH=arm64 SUBARCH=arm64 O=out \
             CC=ccache\ clang HOSTCC=ccache\ clang \
             LD=ld.lld AR=llvm-ar NM=llvm-nm \
             OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             CLANG_TRIPLE=aarch64-linux-gnu-"

          make $M $DEFCONFIG
          make -j${JOBS} $M Image.gz dtbs modules 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Check errors
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -n "error:" build.log | head -200 || true
          echo "=== LAST 300 ==="
          tail -300 build.log

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

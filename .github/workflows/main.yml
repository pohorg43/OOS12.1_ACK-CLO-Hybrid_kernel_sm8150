name: Build Kernel OOS12 - OnePlus 7 Series

on:
  push:
    branches: [ "thirteen", "main", "master" ]
  pull_request:
    branches: [ "thirteen", "main", "master" ]
  workflow_dispatch:
    inputs:
      device:
        description: "Target device label for artifact name"
        required: true
        default: "OnePlus7T"
        type: choice
        options:
          - OnePlus7T
          - OnePlus7Pro
          - OnePlus7

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      DEVICE: ${{ github.event.inputs.device || 'OnePlus7T' }}
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig

      CLANG_DIR: prebuilts-master/clang/host/linux-x86/clang-r383902
      GCC64_DIR: prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
      GCC32_DIR: prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init build log
        run: |
          : > build.log
          {
            echo "Build started: $(date -u)"
            echo "Runner: $(uname -a)"
            echo "Workspace: $PWD"
          } | tee -a build.log

      - name: Install dependencies
        run: |
          set -euxo pipefail
          {
            sudo apt-get update -qq
            sudo apt-get install -y \
              bc bison build-essential ccache flex \
              libelf-dev libncurses-dev libssl-dev \
              python3 rsync zip wget curl git \
              device-tree-compiler
            /usr/bin/dtc --version || true
          } 2>&1 | tee -a build.log

      - name: Cache prebuilts
        uses: actions/cache@v4
        with:
          path: |
            prebuilts-master/clang/host/linux-x86/clang-r383902
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
            prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          key: prebuilts-clang-r383902-gcc49-v4
          restore-keys: |
            prebuilts-clang-r383902-gcc49-

      - name: Fetch Clang r383902
        run: |
          set -euxo pipefail
          {
            mkdir -p "${CLANG_DIR}"

            if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
              TMP_TGZ="/tmp/clang-r383902.tar.gz"
              URLS=(
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz"
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902.tar.gz"
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r28/clang-r383902.tar.gz"
              )

              ok=0
              for url in "${URLS[@]}"; do
                echo "Trying: $url"
                if wget -O "$TMP_TGZ" "$url" && file "$TMP_TGZ" | grep -q "gzip compressed"; then
                  tar -xzf "$TMP_TGZ" -C "${CLANG_DIR}"
                  ok=1
                  break
                fi
              done

              [ "$ok" = "1" ] || { echo "Failed to download clang-r383902"; exit 1; }
            fi

            test -x "${CLANG_DIR}/bin/clang"
            "${CLANG_DIR}/bin/clang" --version
          } 2>&1 | tee -a build.log
      - name: Fetch GCC prebuilts
        run: |
          set -euxo pipefail
          {
            mkdir -p "$(dirname "${GCC64_DIR}")" "$(dirname "${GCC32_DIR}")"

            GCC64_COMMIT="043dc0ad16a73e0e1973132d00fa6265ab4fa6ba"
            GCC32_COMMIT="5ac02a0ba9f39591758bab4516dd0725747af0c3"

            rm -rf "${GCC64_DIR}" "${GCC32_DIR}"
            mkdir -p "${GCC64_DIR}" "${GCC32_DIR}"

            git -C "${GCC64_DIR}" init
            git -C "${GCC64_DIR}" remote add origin https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
            git -C "${GCC64_DIR}" fetch --depth=1 origin "${GCC64_COMMIT}"
            git -C "${GCC64_DIR}" checkout -q FETCH_HEAD

            git -C "${GCC32_DIR}" init
            git -C "${GCC32_DIR}" remote add origin https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
            git -C "${GCC32_DIR}" fetch --depth=1 origin "${GCC32_COMMIT}"
            git -C "${GCC32_DIR}" checkout -q FETCH_HEAD

            ls -la "${GCC64_DIR}/bin" | sed -n '1,20p'
            ls -la "${GCC32_DIR}/bin" | sed -n '1,20p'

            test -x "${GCC64_DIR}/bin/aarch64-linux-android-gcc"
            test -x "${GCC32_DIR}/bin/arm-linux-androideabi-gcc"

            for t in gcc g++ cpp ar as ld nm objcopy objdump ranlib strip; do
              if [ -e "${GCC64_DIR}/bin/aarch64-linux-android-${t}" ] && [ ! -e "${GCC64_DIR}/bin/aarch64-linux-androidkernel-${t}" ]; then
                ln -sf "aarch64-linux-android-${t}" "${GCC64_DIR}/bin/aarch64-linux-androidkernel-${t}"
              fi
            done

            test -x "${GCC64_DIR}/bin/aarch64-linux-androidkernel-gcc"
          } 2>&1 | tee -a build.log

      - name: Export toolchain env
        run: |
          set -euxo pipefail
          {
            echo "${CLANG_DIR}/bin" >> "$GITHUB_PATH"
            echo "${GCC64_DIR}/bin" >> "$GITHUB_PATH"
            echo "${GCC32_DIR}/bin" >> "$GITHUB_PATH"

            echo "CC=clang" >> "$GITHUB_ENV"
            echo "LD=ld.lld" >> "$GITHUB_ENV"
            echo "AR=llvm-ar" >> "$GITHUB_ENV"
            echo "NM=llvm-nm" >> "$GITHUB_ENV"
            echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
            echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
            echo "STRIP=llvm-strip" >> "$GITHUB_ENV"
          } 2>&1 | tee -a build.log

      - name: Configure kernel
        run: |
          set -euxo pipefail
          {
            mkdir -p out
            make O=out ARCH="${ARCH}" "${KERNEL_DEFCONFIG}"
            make O=out ARCH="${ARCH}" olddefconfig
          } 2>&1 | tee -a build.log

      - name: Build kernel
        run: |
          set -euxo pipefail
          {
            make -j"$(nproc)" \
              O=out \
              ARCH="${ARCH}" \
              SUBARCH="${SUBARCH}" \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              CC=clang \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-androidkernel- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              DTC=/usr/bin/dtc \
              DTC_EXT=/usr/bin/dtc \
              DTC_CPP_FLAGS="-P" \
              Image.gz dtbs modules

            echo "=== Boot output ==="
            ls -la out/arch/arm64/boot/ || true
          } 2>&1 | tee -a build.log

      - name: Validate build outputs
        if: success()
        run: |
          set -euxo pipefail
          {
            if [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image ] || [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "Kernel image found."
            else
              echo "Kernel image not found."
              exit 1
            fi
          } 2>&1 | tee -a build.log

      - name: Prepare AnyKernel3 flashable zip
        if: success()
        run: |
          set -euxo pipefail
          {
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh

            if [ -f out/arch/arm64/boot/Image.gz ]; then
              cp out/arch/arm64/boot/Image.gz anykernel/
            elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              cp out/arch/arm64/boot/Image.gz-dtb anykernel/
            else
              cp out/arch/arm64/boot/Image anykernel/
            fi

            if find out/arch/arm64/boot/dts -type f -name "*.dtb" 2>/dev/null | grep -q .; then
              find out/arch/arm64/boot/dts -type f -name "*.dtb" | sort | xargs cat > anykernel/dtb
            elif [ -f out/arch/arm64/boot/dtb ]; then
              cp out/arch/arm64/boot/dtb anykernel/dtb
            fi
          } 2>&1 | tee -a build.log

      - name: Create flashable ZIP
        if: success()
        run: |
          set -euxo pipefail
          {
            cd anykernel
            ZIP_NAME="Kernel-OOS12-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
            zip -r9 "../${ZIP_NAME}" . -x "*.git*"
            echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          } 2>&1 | tee -a build.log

      - name: Upload kernel zip artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OOS12-${{ env.DEVICE }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-build-output-${{ env.DEVICE }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtb
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7
